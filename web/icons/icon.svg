<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Border glow -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.3"/>

  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#22d3ee" stroke-width="1">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Microchip icon (centered) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Chip body -->
    <rect x="-80" y="-80" width="160" height="160" rx="16" fill="url(#cyanGrad)"/>

    <!-- Chip inner -->
    <rect x="-56" y="-56" width="112" height="112" rx="8" fill="#0f172a"/>

    <!-- Chip circuit lines -->
    <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round">
      <!-- Horizontal lines -->
      <line x1="-32" y1="-24" x2="32" y2="-24"/>
      <line x1="-32" y1="0" x2="32" y2="0"/>
      <line x1="-32" y1="24" x2="32" y2="24"/>

      <!-- Vertical connectors -->
      <line x1="0" y1="-32" x2="0" y2="32"/>
    </g>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#22d3ee"/>

    <!-- Pins (top) -->
    <g fill="#22d3ee">
      <rect x="-48" y="-100" width="8" height="20" rx="2"/>
      <rect x="-24" y="-100" width="8" height="20" rx="2"/>
      <rect x="0" y="-100" width="8" height="20" rx="2"/>
      <rect x="24" y="-100" width="8" height="20" rx="2"/>
      <rect x="48" y="-100" width="8" height="20" rx="2"/>
    </g>

    <!-- Pins (bottom) -->
    <g fill="#22d3ee">
      <rect x="-48" y="80" width="8" height="20" rx="2"/>
      <rect x="-24" y="80" width="8" height="20" rx="2"/>
      <rect x="0" y="80" width="8" height="20" rx="2"/>
      <rect x="24" y="80" width="8" height="20" rx="2"/>
      <rect x="48" y="80" width="8" height="20" rx="2"/>
    </g>

    <!-- Pins (left) -->
    <g fill="#22d3ee">
      <rect x="-100" y="-48" width="20" height="8" rx="2"/>
      <rect x="-100" y="-24" width="20" height="8" rx="2"/>
      <rect x="-100" y="0" width="20" height="8" rx="2"/>
      <rect x="-100" y="24" width="20" height="8" rx="2"/>
      <rect x="-100" y="48" width="20" height="8" rx="2"/>
    </g>

    <!-- Pins (right) -->
    <g fill="#22d3ee">
      <rect x="80" y="-48" width="20" height="8" rx="2"/>
      <rect x="80" y="-24" width="20" height="8" rx="2"/>
      <rect x="80" y="0" width="20" height="8" rx="2"/>
      <rect x="80" y="24" width="20" height="8" rx="2"/>
      <rect x="80" y="48" width="20" height="8" rx="2"/>
    </g>
  </g>

  <!-- ANANTA text -->
  <text x="256" y="440" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="48" font-weight="bold" letter-spacing="8">ANANTA</text>
</svg>
