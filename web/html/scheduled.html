<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANANTA // SCHEDULED SCANS</title>

  <meta name="description" content="ANANTA - Scans programmés" />
  <meta name="theme-color" content="#020617" />

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />

  <link rel="stylesheet" href="../css/tailwind.css" />
  <link rel="stylesheet" href="../vendor/fontawesome/all.min.css" />
  <link rel="stylesheet" href="../vendor/fonts/jetbrains-mono.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="bg-[#020617] text-slate-300 font-mono h-screen flex flex-col overflow-hidden">

  <header class="h-16 glass-panel flex items-center justify-between px-8 border-b border-slate-800 z-10">
    <div class="flex items-center gap-4">
      <a href="index.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-cyan-400 transition-colors leading-none">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        <span>Retour Console</span>
      </a>
      <div class="h-6 w-[1px] bg-slate-800"></div>
      <h1 class="text-lg font-bold text-cyan-400 tracking-widest uppercase">
        <i class="fas fa-calendar-alt mr-2"></i>Scans Programmés
      </h1>
    </div>
    <button id="btn-refresh" class="px-4 py-2 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded hover:bg-cyan-500/20 transition-all text-xs font-bold">
      <i class="fas fa-sync mr-2"></i>ACTUALISER
    </button>
  </header>

  <main class="flex-1 overflow-y-auto p-8">
    <div class="max-w-7xl mx-auto">

      <section class="glass-panel p-6 mb-6">
        <h2 class="text-sm font-bold uppercase tracking-widest text-slate-500 mb-4">
          <i class="fas fa-plus mr-2"></i>Créer un scan programmé
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-2">Nom</label>
            <input id="sc-name" type="text" placeholder="Monitoring hebdo"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-2">Cible</label>
            <input id="sc-target" type="text" placeholder="example.com ou 1.1.1.1"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-2">Mode</label>
            <select id="sc-scan-mode" class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm">
              <option value="fast">fast</option>
              <option value="standard">standard</option>
              <option value="full" selected>full</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-2">Template</label>
            <select id="sc-report-template" class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm">
              <option value="detailed" selected>detailed</option>
              <option value="executive">executive</option>
              <option value="technical">technical</option>
              <option value="minimal">minimal</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-2">Langue</label>
            <select id="sc-language" class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm">
              <option value="fr" selected>fr</option>
              <option value="en">en</option>
              <option value="es">es</option>
              <option value="de">de</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-2">Hard limit (tokens)</label>
            <input id="sc-llm-hard-limit" type="number" min="200" max="5000" value="2000"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-2">Planification</label>
            <select id="sc-schedule-type" class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm">
              <option value="daily" selected>daily</option>
              <option value="weekly">weekly</option>
              <option value="monthly">monthly</option>
              <option value="custom">custom (cron)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-2">Heure (0-23)</label>
            <input id="sc-hour" type="number" min="0" max="23" value="8"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
          </div>

          <div id="sc-weekly-wrap" class="hidden">
            <label class="block text-xs text-slate-400 mb-2">Jour semaine (0=lundi .. 6=dimanche)</label>
            <input id="sc-day-of-week" type="number" min="0" max="6" value="0"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
          </div>

          <div id="sc-monthly-wrap" class="hidden">
            <label class="block text-xs text-slate-400 mb-2">Jour mois (1-31)</label>
            <input id="sc-day-of-month" type="number" min="1" max="31" value="1"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
          </div>

          <div id="sc-cron-wrap" class="hidden md:col-span-2">
            <label class="block text-xs text-slate-400 mb-2">Cron expression</label>
            <input id="sc-cron" type="text" placeholder="0 8 * * 1"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs text-slate-400 mb-2">Email notification (optionnel)</label>
            <input id="sc-email" type="email" placeholder="analyste@exemple.com"
              class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-2 text-sm" />
            <div class="mt-3 flex flex-wrap gap-4 text-xs text-slate-400">
              <label class="inline-flex items-center gap-2">
                <input id="sc-notify-on-change" type="checkbox" checked />
                <span>Notifier seulement si changement</span>
              </label>
              <label class="inline-flex items-center gap-2">
                <input id="sc-notify-on-error" type="checkbox" checked />
                <span>Notifier en cas d'erreur</span>
              </label>
            </div>
          </div>
        </div>

        <button id="btn-create" class="mt-5 w-full px-6 py-3 bg-cyan-500 text-slate-900 font-bold rounded-lg hover:bg-cyan-400 transition-all">
          <i class="fas fa-check mr-2"></i>CRÉER
        </button>

        <p id="sc-msg" class="text-xs text-slate-500 mt-3"></p>
      </section>

      <section class="glass-panel p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold uppercase tracking-widest text-slate-500">
            <i class="fas fa-list mr-2"></i>Scans configurés
          </h2>
          <div class="text-xs text-slate-500" id="list-meta">--</div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="text-slate-500 uppercase text-xs font-bold border-b border-slate-800">
              <tr>
                <th class="py-3 pr-3">Nom</th>
                <th class="py-3 pr-3">Cible</th>
                <th class="py-3 pr-3">Type</th>
                <th class="py-3 pr-3">Prochain</th>
                <th class="py-3 pr-3">Statut</th>
                <th class="py-3">Actions</th>
              </tr>
            </thead>
            <tbody id="scheduled-body" class="divide-y divide-slate-800/50"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script src="../javascript/theme.js"></script>
  <script src="../javascript/scheduled.js"></script>
</body>
</html>
