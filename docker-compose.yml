# Ananta - pile complète pour un serveur.
#
#   docker compose up -d
#
# Trois topologies, une seule commande :
#
#   1. Serveur seul, sans IA        -> LLM_PROVIDER=none
#   2. Serveur + IA sur votre poste -> LLM_PROVIDER=ollama, OLLAMA_HOST=http://<votre-ip>:11434
#   3. Tout sur la même machine     -> profil `ollama` (docker compose --profile ollama up -d)
#
# Voir docs/deployment.md.

name: ananta

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ananta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-ananta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ananta} -d ${POSTGRES_DB:-ananta}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ananta]
    # Pas de port publié : seuls les services de la pile y accèdent.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [ananta]

  api:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-0}
    image: ananta:latest
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment: &ananta-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-ananta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ananta}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      ANANTA_BOOTSTRAP_TOKEN: ${ANANTA_BOOTSTRAP_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8010}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      ALLOW_INSECURE_TARGET_TLS: ${ALLOW_INSECURE_TARGET_TLS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

      # --- Moteur d'inférence (interchangeable à chaud via /llm/provider) ---
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-420}
      LLM_SYSTEM_PROMPT: ${LLM_SYSTEM_PROMPT:-}
      LLM_SYSTEM_PROMPT_FILE: ${LLM_SYSTEM_PROMPT_FILE:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      CLAUDE_CLI_MODEL: ${CLAUDE_CLI_MODEL:-}
      CLAUDE_CLI_ARGS: ${CLAUDE_CLI_ARGS:-}
      CODEX_CLI_MODEL: ${CODEX_CLI_MODEL:-}
      CODEX_CLI_ARGS: ${CODEX_CLI_ARGS:-}

      # --- Sources OSINT optionnelles ---
      CENSYS_API_KEY: ${CENSYS_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
      OPENSANCTIONS_API_URL: ${OPENSANCTIONS_API_URL:-}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      OPENCORPORATES_API_KEY: ${OPENCORPORATES_API_KEY:-}
      PAPPERS_API_KEY: ${PAPPERS_API_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SEC_EDGAR_CONTACT: ${SEC_EDGAR_CONTACT:-}
    volumes:
      - ananta-logs:/app/logs
    ports:
      - "${ANANTA_PORT:-8010}:8010"
    # `host.docker.internal` permet de viser un Ollama qui tourne sur la machine hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ananta]
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn main:app --host 0.0.0.0 --port 8010 --proxy-headers"

  worker:
    image: ananta:latest
    restart: unless-stopped
    depends_on:
      api: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment: *ananta-env
    volumes:
      - ananta-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ananta]
    command: >
      python -m celery -A tasks.app worker
      -Q default,osint_fast,osint_medium,osint_critical,priority,maintenance
      --concurrency=${WORKER_CONCURRENCY:-4} --loglevel=info

  beat:
    image: ananta:latest
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    environment: *ananta-env
    volumes:
      - ananta-logs:/app/logs
    networks: [ananta]
    command: python -m celery -A tasks.app beat --loglevel=info

  # IA locale dans la pile — activée seulement avec `--profile ollama`.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks: [ananta]
    # Décommentez pour exploiter un GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres-data:
  redis-data:
  ollama-models:
  ananta-logs:

networks:
  ananta:
    driver: bridge
