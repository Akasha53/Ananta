name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  ENVIRONMENT: "test"
  RATE_LIMIT_ENABLED: "false"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check .

      - name: Check browser JavaScript syntax
        run: |
          find web/javascript -name '*.js' -print0 | xargs -0 -n1 node --check

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing \
            --ignore=text-generation-webui \
            --ignore=text-generation-webui_BACKUP

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Block high-severity code findings
        run: |
          bandit -r . \
            -x ./text-generation-webui,./text-generation-webui_BACKUP,./tests,./alembic,./.venv,./venv \
            --severity-level medium

      - name: Check dependencies for vulnerabilities
        run: pip-audit --strict -r requirements-lock.txt

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt

      - name: Verify imports
        run: |
          python -c "from main import app; print('FastAPI app loaded successfully')"
          python -c "from middleware import RequestIDMiddleware; print('Middleware loaded')"
          python -c "from models import ScanRequest; print('Models loaded')"

      - name: Check database migrations
        run: |
          migration_dir="$(mktemp -d)"
          export DATABASE_URL="sqlite:///${migration_dir}/ananta.db"
          alembic upgrade head
          alembic downgrade base

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: failure()
    steps:
      - name: Create failure summary
        run: |
          echo "## CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more jobs failed. Please check the logs for details." >> $GITHUB_STEP_SUMMARY
